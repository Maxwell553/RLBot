# RLBot centralized configuration — version control this file with training runs.
# CLI flags in train.py override run-specific dates/run-id; hyperparameters default here.

# Number of tradeable assets N = number of keys under ``assets`` (supported range: 5–55).
# Each list in reward.benchmark_cap_weights and transaction_costs.* must have exactly N floats
# in the same key order. After edits: ``python scripts/train.py --refresh-data`` then a new --run-id.
universe:
  benchmark: SP500
  assets:
    SP500: SPY
    GOLD: GLD
    OIL: USO
    EURUSD: EURUSD=X
    USDJPY: USDJPY=X
    NIKKEI: "^N225"
    FTSE: "^FTSE"
    BOND10Y: IEF
    COPPER: HG=F
    EM: EEM

environment:
  initial_cash: 100000.0
  max_episode_steps: 252
  lookback: 20
  obs_lag_default: 1
  min_obs_lag: 0
  max_obs_lag: 2
  max_single_asset_weight: 0.20
  fee_scale_default: 1.0
  stop_loss_fraction: 0.45
  domain_randomize_fee_dr_min: 0.75
  domain_randomize_fee_dr_max: 1.1
  action_smoothing_alpha: 0.15  # same train + backtest (EMA on raw policy logits)
  domain_randomize_fee_beta_a: 5.0
  domain_randomize_fee_beta_b: 5.0
  # Append 4 causal portfolio self-state features to the observation (realized vol,
  # downside vol, rolling excess vs the reward benchmark, near-cap fraction) so the
  # policy can see its own risk state. Changes obs_dim (10N+28 → 10N+32); old run
  # snapshots without this key keep their original layout.
  self_state_features: true
  # Two-head action (exposure logit + risky allocation). Cohort 727 science flip: ON
  # so the policy has an explicit gross-exposure head instead of burying cash in a
  # joint softmax (726 stayed ~fully invested OOS on W2–W5).
  two_head_actions: true
  # Cohort 728: soft DD exposure taper — mechanical left-tail brake. Once episode
  # NAV is 6% off peak, start scaling risky weights toward cash; by 12% DD, gross
  # is capped at 30%. Applies in train + OOS (same env). Goal: cut W2–W5 crash DDs
  # (727 still saw −12% to −24% while ~95% invested).
  dd_exposure_taper: true
  dd_exposure_taper_start: 0.06
  dd_exposure_taper_end: 0.12
  dd_exposure_taper_min_gross: 0.30

reward:
  reward_scale: 2000.0
  max_step_log_return: 0.06
  max_step_log_return_downside: -0.12
  risk_window: 63
  sortino_min_steps: 20
  # Floor on downside deviation in the Sortino ratio, in daily-return units (0.001 =
  # 10 bp/day). The old 1e-4 floor let any no-loss window (e.g. ~90% cash + carry)
  # saturate the ±3 clipped differential — a quasi-binary +risk_bonus_scale*3 exploit.
  sortino_downside_floor: 0.001
  # Sortino diff scale (paired with benchmark_excess; capped together at benchmark_combined_abs_cap).
  # Reverted 4.0 → 2.5 after the 721/722 cohorts: the diff is clipped at ±3, so extra
  # weight adds a constant "stay ahead of benchmark" bonus (risk-on on trending train
  # data), not gradient. Under 4.0 the in-training eval excess-Sharpe DECLINED
  # monotonically past ~20M steps on W3/W5 (720 under 2.5 stayed flat) and OOS mean
  # Sharpe dropped 0.98 → 0.92. See docs/RESEARCH.md (721/722 postmortem).
  risk_bonus_scale: 2.5
  # Equal-weight passive benchmark (1/N per asset; feasible under max_single_asset_weight 0.20)
  benchmark_cap_weights: [0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10, 0.10]
  # clip(agent_log_ret - bench_log_ret) * scale; uses same friction model as Sortino benchmark
  # Cohort 728: 600 → 400 — less reward for riding crash→rebound excess (W3 pattern).
  benchmark_excess_scale: 400.0
  benchmark_excess_clip: 0.04
  # CONSTANT cap on |sortino + benchmark| per step (reward units; 0 disables both).
  # Deliberately not relative to the other terms: a share-of-other-mass cap let the
  # agent raise the cap by burning costs / taking losses (reward-hacking gradient).
  # 24 ≈ the benchmark-excess clip max (0.04 × 600); it trims only extreme days when
  # the Sortino diff (≤ ±7.5) and the excess clip saturate together (raw max 31.5).
  benchmark_combined_abs_cap: 24.0
  # tx_cost_frac * churn_penalty * reward_scale * VIX_scale * curriculum_churn_scale
  churn_penalty: 4.0  # multiplier on realized tx cost (slippage + fees) in reward units
  # turnover_frac * turnover_penalty * reward_scale * VIX_scale * curriculum_churn_scale
  turnover_penalty: 0.007
  drawdown_downside_gamma: 12.0  # amplifies negative step returns when already in drawdown
  # Cap on the (1 + gamma * dd) amplification factor. Uncapped, deep-drawdown days
  # produce reward outliers far beyond VecNormalize's clip_reward band, so all bad
  # days saturate identically (no gradient). 4.0 saturates at dd = 25%. 0 = uncapped.
  drawdown_amp_max: 4.0
  # Direct drawdown shaping (applied every step; logged as rew_decomp/drawdown_penalty):
  # Cohort 728: intensify fresh-DD and level taxes so the exposure head de-risks
  # *before* the mechanical taper fires (increase 1→2, level 100→160, floor 5%→3%).
  drawdown_increase_penalty: 2.0  # × reward_scale on fresh dd expansion
  # NOTE the asymmetry: the increase term is × reward_scale (2000) but the level term
  # is NOT — it is raw `dd_excess × drawdown_level_penalty × exposure_factor` per step.
  # At the old 3–6 range that was a no-op (~4–5% reward mass). 100.0 at 15% off peak
  # and full gross costs ~10/step — larger than max inactivity (~0.20) so drawdown
  # dominates the cash-vs-invested tradeoff. See drawdown_level_exposure_coupling.
  drawdown_level_penalty: 160.0  # × max(dd_next - floor, 0) × exposure_factor each step
  drawdown_level_floor: 0.03  # no level penalty until 3% off episode peak
  # Structural H1 fix: couple the persistent level term to gross exposure.
  # level *= (1 - c) + c * gross. At c=1, fully de-risking to cash zeros the level
  # tax (the escape hatch that was missing when level punished underwater NAV even
  # in cash — agents then stayed invested to "earn their way out"). 0 = legacy.
  drawdown_level_exposure_coupling: 1.0
  # Portfolio diversification: penalty * max(target_eff_n - eff_n, 0)
  concentration_penalty: 0.75
  concentration_target_eff_assets: 6.0
  # Cohort 727: raise cash carry (~5.0% ann.) so de-risking via the exposure head
  # competes with equity beta on merit.
  cash_daily_yield: 0.0002
  # Softened vs 720–723 (0.35/0.15 → max 0.50): calm-market cash tax must stay well
  # below underwater-and-invested DD level (~10/step) so "always invested" is not the
  # equilibrium. Max inactivity now ~0.20 at 100% cash in a calm, non-DD regime.
  inactivity_penalty_over_50: 0.15  # linear: cash_frac * this (no 50% step cliff)
  inactivity_penalty_over_90: 0.05  # extra linear ramp from 90% → 100% cash
  # VIX-conditional relief on the inactivity penalty: multiplier
  # 1 - clip((VIX/18 - 1) * relief, 0, 1). At 1.0: half penalty at VIX 27, none at
  # VIX >= 36 — holding cash in stress is not punished like idling in calm markets.
  inactivity_vix_relief: 1.0
  # Own-drawdown relief (H1): same form over (dd - floor) / span. Combined with VIX
  # relief by most-relief-wins. At 1.0 / span 0.10, inactivity is fully waived by
  # dd >= 15% — cash is the escape hatch once underwater, not a calm-market idling tax.
  inactivity_drawdown_relief: 1.0
  inactivity_drawdown_relief_span: 0.10
  eval_inactivity_penalty_scale: 1.0
  # Cohort 727: zero the invest nudge — two-head exposure must earn its keep via
  # return / excess / Sortino, not a calm-market participation bonus.
  participation_bonus: 0.0
  participation_reward_scale: 10.0
  # Mirror of inactivity relief on the participation bonus (VIX + own-DD, most-relief-
  # wins). At high VIX or once underwater, the agent earns nothing just for being
  # invested — shaping goes neutral and returns / DD-coupled level decide. 0 disables.
  participation_vix_relief: 1.0
  participation_drawdown_relief: 1.0
  # Cut gross exposure when realized vol (or VIX+) is elevated: gross * vol_or_vix * scale
  # Cohort 728: switch to VIX+ so de-risking starts on stress *signals* before NAV DD
  # fully materializes (realized_vol lags the crash). Scale ~2.5: at VIX 36, z≈1 →
  # ~2.5 reward units at full gross (same band as other shaping terms).
  exposure_risk_mode: vix_positive  # realized_vol | vix_positive
  exposure_risk_penalty_scale: 2.5
  # Penalize excess downside vol vs the passive benchmark book (same window as Sortino):
  # -vol_penalty_scale * reward_scale * max(agent_downside_vol - benchmark_downside_vol, 0)
  # Cohort 728: 0.30 → 0.45 — stronger left-tail vol tax (~0.9/step typical excess).
  vol_penalty_scale: 0.45

# Per-asset costs (one entry per universe.assets key, same order)
transaction_costs:
  slippage: [0.0001, 0.0002, 0.0003, 0.0001, 0.0001, 0.0005, 0.0005, 0.0001, 0.0008, 0.0002]
  tx_fee: [0.0001, 0.0002, 0.0002, 0.00005, 0.00005, 0.0010, 0.0010, 0.0001, 0.0005, 0.0002]
  annual_holding_cost: [0.0009, 0.0040, 0.0083, 0.0, 0.0, 0.0010, 0.0010, 0.0015, 0.0060, 0.0067]
  trading_days_per_year: 252

hyperparameters:
  learning_rate: 3.0e-4
  learning_rate_floor: 1.0e-6
  # phase_aware: hold 3e-4 until DR widening completes (~35M on the rephased 50M
  # schedule), then cosine → floor over the settled remainder. The legacy global
  # cosine had LR at ~1e-4 by the best-model gate and ~2e-5 at full DR — adaptation
  # was frozen exactly while fee/lag conditions were still changing (723/724 evidence:
  # post-gate eval scores declined monotonically and never recovered).
  lr_schedule: phase_aware
  batch_size: 16384  # <= n_steps * n_envs; 65536/16384 = 4 mini-batches/epoch × n_epochs 3 = 12 backprop loops/pause
  n_steps: 4096
  n_epochs: 3
  gamma: 0.975
  gae_lambda: 0.95
  clip_range: 0.2
  clip_range_finetune: 0.1
  ent_coef_initial: 0.045
  ent_coef_finetune: 0.001
  vf_coef: 0.5
  max_grad_norm: 0.5
  weight_decay: 1.0e-3

policy:
  lstm_hidden_size: 64
  n_lstm_layers: 2
  net_arch_pi: [128, 128]
  net_arch_vf: [128, 128]

training:
  timesteps: 50000000
  n_envs: 16
  obs_noise: 0.02
  seed: 0
  block_size: 126
  eval_stride: 4
  eval_n_episodes: 1  # fallback if segment list empty; train.py sets n_eval = #eval blocks
  eval_freq_steps: 500000          # post fee-ramp eval cadence (global timesteps)
  eval_freq_pre_gate_steps: 3000000  # pre fee-ramp cadence (best saves gated until ramp end)
  holdout_days: 365
  viz_freq: 500000
  curriculum_update_freq: 50000   # GLOBAL timesteps between curriculum/decomp updates (divided by n_envs internally)
  checkpoint_save_freq_steps: 1000000
  reproducible: false        # true → deterministic per-env seed streams (bit-reproducible)
  early_stop_patience: 12    # >0 → stop after K evals with no new best (after curriculum)
  # Benchmark-relative eval selection (equal-weight daily passive book by default):
  # score = (1-blend)*mean(excess) + blend*stitched_excess - std_coef*std(excess) - dd_coef*p75(max_dd)
  best_model_score_std_coef: 0.75
  # Raised 2.0 → 3.0 with excess_sharpe (727); 3.0 → 8.0 with defensive_sharpe (728):
  # penalty is on unitless max(max_dd_frac), so 8.0 × 0.15 DD ≈ −1.2 score — deep
  # left-tail checkpoints lose even with strong excess Sharpe.
  best_model_score_dd_coef: 8.0
  best_model_score_stitched_blend: 0.5  # 0 = segment mean only; 1 = stitched excess only
  best_model_benchmark: equal_weight_daily  # balanced_6040 | equal_weight_daily
  # Cohort 728: defensive_sharpe = excess Sharpe signal − dd_coef × max(max_dd_frac)
  # (not p75). Pairs with best_model_max_dd_reject so selection prefers shallow-DD
  # policies that should transfer to crashy OOS windows (W2–W5).
  best_model_score_mode: defensive_sharpe
  # Hard gate: never save best if any multi-regime slice max DD exceeds 15%.
  best_model_max_dd_reject: 0.15
  # Checkpoint hardening (0 / false = legacy single-eval immediate replace).
  # Enabled after 723/724: single-eval immediate replacement selected checkpoints at the
  # first post-gate eval (still mid-DR-widening) on 4 of 6 runs — a noisy score under a
  # moving training distribution. Trailing-3 median + like-for-like stress blend selects
  # for sustained quality under fixed adverse (1.5× fee / lag-2) conditions instead.
  best_model_trailing_evals: 3       # median of last 3 post-gate scores
  best_model_trailing_agg: median
  best_model_confirm_evals: 0        # trailing median already suppresses one-eval spikes
  best_model_stress_suite: true      # blend fixed high-fee/high-lag stress eval (both sides priced)
  best_model_stress_weight: 0.3
  # Cohort 727 multi-regime selection retained: K continuous overlays + P25 aggregate.
  # 728 layers defensive_sharpe + max-DD reject on top (eval↔OOS verification target:
  # selected checkpoint's eval max_dd should track OOS max_dd, not just Sharpe).
  oos_aligned_eval: true
  oos_aligned_eval_bars: 252         # per-regime slice (~1y continuous)
  oos_aligned_eval_weight: 1.0       # selection fully on multi-regime aggregate
  multi_regime_eval: true
  multi_regime_eval_slices: 5        # evenly spaced continuous overlays
  multi_regime_eval_agg: p25         # p25 | median | min | mean
  eval_score_burn_in_bars: 21        # ~1 month deploy transient discarded per episode

vec_normalize:
  norm_obs: true
  norm_reward_train: true
  clip_obs: 10.0
  clip_reward: 10.0

entropy_schedule:
  explore_ent: 0.045
  final_ent: 0.001
  early_floor: 0.01
  early_floor_high: 0.02
  warmup_improvements: 5  # logged only (eval NAV); does not gate decay
  decay_start_fraction: 0.45  # cosine decay starts after fee_ramp_fraction (0.45)
  dr_lock_fraction: 0.10
  early_floor_fraction: 0.45  # exploration floors through fee ramp (same milestone as decay start)

# Smoothed curriculum track: spread fee / churn / DR shifts across the 50M run (avoids mid-run cliffs).
curriculum:
  budget_short: 50000000
  budget_long: 120000000
  # ≤ budget_short: fraction-of-run schedule. Rephased (0.13/0.585 → 0.10/0.45) after the
  # 723/724 cohorts: post-gate eval scores declined monotonically on every window — the
  # curriculum finished so late that the policy trained under final (full-fee, widening-DR)
  # conditions only in the last few M steps, with LR already collapsed. Now: fee-free ~5M,
  # full fees + best-gate at ~22.5M, DR widen 22.5M→35M, then 15M settled full-DR training.
  fee_free_fraction: 0.10   # ~5M
  fee_ramp_fraction: 0.45   # ~22.5M
  churn_ramp_floor: 0.10  # churn scale at fee-ramp start; ramps to 1.0 by fee_ramp_end
  # 0.25 → DR widen ends ~35M (fee_ramp 22.5M + 12.5M), leaving ~15M stationary full-DR.
  # Was 0.65 (curriculum ate the whole 50M; early stop unreachable).
  dr_widen_span_fraction: 0.25
  # Long-run anchors (≥ budget_long)
  fee_free_long: 13300000
  fee_ramp_end_long: 40000000
  dr_widen_span_long: 30000000
  # Gate models/best/ saves until this step (null = fee_ramp_end for learn budget).
  # Eval NAV is always logged; set 0 to disable the gate.
  best_model_min_step: null

data:
  since: "2005-01-01"
  fracdiff_d: 0.4
  feature_purge_warmup: 25  # neutralize first N bars only where preroll history is unavailable (panel head)
  # Causal warmup history recomputed per segment in independent mode (sliced off after
  # feature computation) so EMA-100/MACD/fracdiff are not dominated by truncation
  # transients inside 126-bar eval blocks.
  feature_preroll_bars: 252
  # "continuous": features precomputed on the contiguous panel then sliced into
  #   train/eval blocks (matches continuous backtest memory; purge NOT applied).
  # "independent" (default): recompute features per segment over a BOUNDED causal
  #   preroll window (uniform history depth at every segment head, vs continuous's
  #   unbounded panel memory). NOTE: the preroll bars ARE the adjacent train blocks,
  #   so short-memory indicators (RSI-14/MACD-26/EMA-100/vol-20) match continuous
  #   bit-for-bit once preroll covers their memory — the modes differ mainly in
  #   fracdiff's long tail and in head-of-panel handling, not in train/eval isolation.
  #   Only panel-head bars with insufficient preroll are purged.
  feature_split_mode: independent
