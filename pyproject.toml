[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market_trainer"
version = "1.0.0"
description = "RecurrentPPO multi-asset portfolio deep reinforcement learning framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RLBot" }]
dependencies = [
    "gymnasium>=0.29.0",
    "stable-baselines3>=2.2.0",
    "sb3-contrib>=2.2.0",
    "torch>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "tensorboard>=2.14.0",
    "yfinance>=0.2.30",
    "PyYAML>=6.0.0",
    "tqdm>=4.65.0",
    "rich>=13.0.0",
]

[project.scripts]
market-trainer-train = "scripts.train:main"
market-trainer-backtest = "scripts.backtest:main"
market-trainer-audit = "scripts.audit_runs:main"
market-trainer-preflight = "scripts.preflight:main"
market-trainer-dashboard = "scripts.dashboard:main"
market-trainer-workflow-api = "scripts.workflow_api:main"

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]
modal = ["modal>=0.66.0", "fastapi>=0.100.0"]
api = ["fastapi>=0.100.0", "uvicorn>=0.23.0", "curl-cffi>=0.15.0"]
live = ["ib_insync>=0.9.86"]

[tool.pytest.ini_options]
# Only collect from tests/ — Runs/<id>/provenance/untracked/ archives untracked
# sources (including test files) for reproducibility and must not be collected.
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rlbot*", "scripts*"]

[tool.setuptools.data-files]
"" = ["config/config.yaml"]
